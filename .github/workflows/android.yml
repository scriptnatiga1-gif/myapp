name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git zip unzip openjdk-17-jdk python3-pip \
          libltdl-dev libffi-dev libssl-dev autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 libbz2-dev

    - name: Force Accept All Licenses and Patch sdkmanager
      run: |
        mkdir -p $ANDROID_HOME/licenses
        printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c1059b8ea4b034\n" > $ANDROID_HOME/licenses/android-sdk-license
        printf "d975f751698a77b662f1254ddbeed3901e976f5a\n" > $ANDROID_HOME/licenses/android-sdk-preview-license
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;37.0.0" "build-tools;33.0.2" "platforms;android-33" "platform-tools" || true
        ls $ANDROID_HOME/build-tools/37.0.0/aidl
        # ده السحر - بنخلي اي sdkmanager يتسأل يرد yes لوحده
        mv $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.real
        printf '#!/bin/bash\nyes | %s/sdkmanager.real "$@"\n' $ANDROID_HOME/cmdline-tools/latest/bin > $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
        chmod +x $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
        echo "Patched sdkmanager to auto-accept licenses"

    - name: Install Buildozer Stable
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade "cython==0.29.33" setuptools==68.0.0 pexpect
        pip install --upgrade buildozer==1.5.0

    - name: Run Buildozer
      run: |
        rm -rf .buildozer bin
        mkdir -p .buildozer/android/platform
        ln -sf $ANDROID_HOME .buildozer/android/platform/android-sdk
        buildozer android debug --no-log

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: attendance-app-release
        path: bin/*.apk
        if-no-files-found: error
