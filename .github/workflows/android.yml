name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            autoconf libtool pkg-config cmake \
            zlib1g-dev libncurses5-dev libtinfo6 \
            libffi-dev libssl-dev libltdl-dev

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0"

      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload APK and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hodour-apk-and-logs
          if-no-files-found: warn
          path: |
            bin/*.apk
            build.log
            .buildozer/**/*.log
