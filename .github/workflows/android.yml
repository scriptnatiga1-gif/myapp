name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Accept Android SDK licenses before Buildozer runs its own SDK manager.
      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            autoconf automake libtool pkg-config cmake \
            zlib1g-dev libncurses5-dev libtinfo6 \
            libffi-dev libssl-dev libltdl-dev

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0"

      - name: Prepare SDK manager for Buildozer and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME was not set by setup-android}"
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          if [[ -z "${SDKMANAGER:-}" || ! -x "$SDKMANAGER" ]]; then
            echo "ERROR: Android sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi

          mkdir -p "$SDK_DIR/tools/bin" "$SDK_DIR/cmdline-tools/latest" "$SDK_DIR/licenses"
          # Buildozer 1.5.0 looks for the old tools/bin/sdkmanager path.
          # This wrapper redirects it to the modern command-line tools and SDK root.
          cat > "$SDK_DIR/tools/bin/sdkmanager" <<EOF
          #!/usr/bin/env bash
          exec "$SDKMANAGER" --sdk_root="$SDK_DIR" "\$@"
          EOF
          chmod +x "$SDK_DIR/tools/bin/sdkmanager"

          # Make modern command-line tools available inside Buildozer's SDK directory.
          cp -a "$ANDROID_HOME/cmdline-tools/latest/." "$SDK_DIR/cmdline-tools/latest/"
          cp -a "$ANDROID_HOME/licenses/." "$SDK_DIR/licenses/"

          # Accept licenses for the SDK root Buildozer actually uses.
          yes | "$SDK_DIR/tools/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK_DIR/tools/bin/sdkmanager" "platform-tools" "platforms;android-33" "build-tools;33.0.2" >/dev/null
          echo "Prepared SDK manager at $SDK_DIR/tools/bin/sdkmanager"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
          APK_PATH="$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$APK_PATH" ]]; then
            echo "ERROR: Buildozer finished without producing an APK."
            exit 1
          fi
          echo "APK created: $APK_PATH"

      - name: Upload APK and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hodour-apk-and-logs
          if-no-files-found: warn
          path: |
            bin/*.apk
            build.log
            .buildozer/**/*.log
