name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
        
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Install Deps
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev libltdl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.33
          pip install buildozer

      - name: Build APK
        run: |
          rm -rf .buildozer bin
          yes | buildozer android debug --verbose
          
      - name: Show results
        if: always()
        run: |
          ls -lh bin/ || true
          find . -name "*.apk" | head -20

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-and-logs
          path: |
            bin/*.apk
            .buildozer/logs/*.log
          if-no-files-found: warn
