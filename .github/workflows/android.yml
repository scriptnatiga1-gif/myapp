
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            python3-pip python3-venv \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Verify configuration
        run: |
          echo "=== Android configuration ==="
          grep -E '^(android\.|requirements|source\.dir|package\.)' buildozer.spec

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Diagnose SDK if build fails
        if: failure()
        run: |
          echo "=== SDK files ==="
          find "$HOME/.buildozer/android/platform" \
            -maxdepth 5 \
            \( -name aidl -o -name sdkmanager \) \
            -print 2>/dev/null || true

          echo "=== Buildozer spec ==="
          grep -E 'android\.(api|minapi|accept_sdk_license|skip_update|sdk_path|ndk_path|build_tools_version)' \
            buildozer.spec || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: attendance-apk
          path: bin/*.apk
          if-no-files-found: error
