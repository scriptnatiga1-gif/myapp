name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git zip unzip openjdk-17-jdk python3-pip \
          libltdl-dev libffi-dev libssl-dev autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 libbz2-dev

    - name: Install Buildozer Stable
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade "cython==0.29.33" setuptools==68.0.0 pexpect
        pip install --upgrade buildozer==1.5.0

    - name: Run Buildozer
      run: |
        rm -rf .buildozer bin
        buildozer android debug --no-log

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: attendance-app-release
        path: bin/*.apk
        if-no-files-found: error
