name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          python3-pip \
          libltdl-dev \
          libffi-dev \
          libssl-dev \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo6 \
          libbz2-dev

    - name: Install Buildozer & Cython
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade "cython==3.0.10" buildozer

    - name: Check files
      run: |
        ls -lh
        ls -lh icon.png presplash.png || echo "⚠️ icon.png مش موجود - هيستخدم ايقونة افتراضية"
        test -f buildozer.spec && echo "spec موجود" || echo "buildozer.spec مش موجود"

    - name: Run Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: attendance-app-release
        path: bin/*.apk
        if-no-files-found: error
