name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git zip unzip openjdk-17-jdk python3-pip \
          libltdl-dev libffi-dev libssl-dev autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 libbz2-dev

    - name: Accept Android SDK Licenses & Install Build-Tools
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "build-tools;37.0.0" "platforms;android-33" "platforms;android-34" "platform-tools"
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        cp $ANDROID_HOME/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ || true
        ls $ANDROID_HOME/build-tools/33.0.2/aidl
        ls $ANDROID_HOME/build-tools/37.0.0/aidl

    - name: Install Buildozer Stable
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade "cython==0.29.33" setuptools==68.0.0 pexpect
        pip install --upgrade buildozer==1.5.0

    - name: Run Buildozer
      run: |
        rm -rf .buildozer bin
        mkdir -p .buildozer/android/platform/android-sdk/licenses
        yes | cp $ANDROID_HOME/licenses/* .buildozer/android/platform/android-sdk/licenses/ || true
        yes | buildozer android debug --no-log

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: attendance-app-release
        path: bin/*.apk
        if-no-files-found: error
