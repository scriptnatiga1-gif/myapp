name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Build APK with Kivy Docker
      run: |
        docker pull kivy/buildozer:latest
        docker run --rm \
          -v $PWD:/home/user/hostcwd \
          -w /home/user/hostcwd \
          kivy/buildozer:latest \
          android debug

    - name: Fix permissions
      run: sudo chown -R $USER:$USER bin/ .buildozer/ || true

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: attendance-app-release
        path: bin/*.apk
        if-no-files-found: error
