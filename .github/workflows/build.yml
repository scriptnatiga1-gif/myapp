name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk python3-pip zip unzip libffi-dev libssl-dev libsqlite3-dev libltdl-dev libncurses5-dev libncursesw5-dev zlib1g-dev libbz2-dev libreadline-dev libgdbm-dev liblzma-dev tk-dev libgomp1
          pip3 install --upgrade pip
          pip3 install Cython==0.29.33 buildozer

      - name: Accept Android licenses and install build-tools
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk
          yes | sdkmanager --licenses || true
          sdkmanager --install "build-tools;33.0.2" "platform-tools" "platforms;android-33" || true
          # buildozer بيحمل sdk خاص بيه - نقبل تراخيصه كمان
          mkdir -p ~/.android
          echo "count=0" > ~/.android/repositories.cfg || true

      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          export PATH=$PATH:$ANDROID_SDK_ROOT/build-tools/33.0.2:$ANDROID_SDK_ROOT/platform-tools
          yes | buildozer android debug --verbose || buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mansour-APK-FIXED
          path: bin/*.apk
          if-no-files-found: error
