name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip zip unzip wget libffi-dev libssl-dev
          pip3 install --upgrade pip
          pip3 install Cython==0.29.33 buildozer

      - name: Fix sdkmanager path for buildozer
        run: |
          export SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_DIR
          cd /tmp
          rm -rf cmdline-tools.zip cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p $SDK_DIR/cmdline-tools/latest
          cp -r cmdline-tools/* $SDK_DIR/cmdline-tools/latest/ 2>/dev/null || cp -r cmdline-tools/lib $SDK_DIR/cmdline-tools/latest/ && cp -r cmdline-tools/NOTICE.txt $SDK_DIR/cmdline-tools/latest/ 2>/dev/null || true
          mkdir -p $SDK_DIR/tools/bin
          ln -sf $SDK_DIR/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/sdkmanager
          ln -sf $SDK_DIR/cmdline-tools/latest/bin/avdmanager $SDK_DIR/tools/bin/avdmanager || true
          mkdir -p ~/.android
          echo "count=0" > ~/.android/repositories.cfg
          export PATH=$SDK_DIR/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager --install "build-tools;33.0.2" "platform-tools" "platforms;android-33" "ndk;25b" || true
          ls -l $SDK_DIR/tools/bin/
          ls -l $SDK_DIR/cmdline-tools/latest/bin/

      - name: Build APK
        run: |
          export SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_HOME=$SDK_DIR
          export ANDROID_SDK_ROOT=$SDK_DIR
          export PATH=$SDK_DIR/cmdline-tools/latest/bin:$SDK_DIR/build-tools/33.0.2:$SDK_DIR/platform-tools:$PATH
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mansour-APK-FIXED
          path: bin/*.apk
