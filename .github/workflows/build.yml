name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip openjdk-17-jdk libffi-dev libssl-dev libltdl-dev libbz2-dev libsqlite3-dev libncurses5-dev libreadline-dev
          pip install Cython==0.29.33 buildozer
      - name: FIX SDK + Aidl
        run: |
          export SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_DIR
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mkdir -p $SDK_DIR/cmdline-tools/latest
          cp -r cmdline-tools/* $SDK_DIR/cmdline-tools/latest/
          mkdir -p $SDK_DIR/tools/bin
          ln -sf $SDK_DIR/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/sdkmanager
          mkdir -p ~/.android $SDK_DIR/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK_DIR/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK_DIR/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea4b324" >> $SDK_DIR/licenses/android-sdk-license
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --install "build-tools;37.0.0" "platform-tools" "platforms;android-34" || true
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - name: Build APK
        run: |
          export SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_HOME=$SDK_DIR
          export ANDROID_SDK_ROOT=$SDK_DIR
          export PATH=$SDK_DIR/cmdline-tools/latest/bin:$SDK_DIR/build-tools/37.0.0:$PATH
          buildozer android debug
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-final
          path: bin/*.apk
